name: Check storefront SEO

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check crawlability, product images and checkout catalogue
        run: npm run audit:seo && npm run audit:product-images && npm run verify:payment-catalog
      - name: Check VOOK India pages, colour images and AI metadata
        run: node scripts/audit-vook-seo.js
      - name: Check expanded catalogue stock, photos and checkout prices
        run: node scripts/audit-expanded-catalog.js
      - name: Check confirmed delivery times and required pre-order dates
        run: node scripts/test-fulfilment-policy.js
      - name: Check factual Shopping descriptions
        run: node scripts/test-merchant-description.js
      - name: Check custom bike configuration and category navigation
        run: node scripts/verify-sava-a7l.js && node scripts/test-tavelo-grid.js && node scripts/test-tavelo-preview-pricing.js
