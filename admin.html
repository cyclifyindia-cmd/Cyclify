<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Orders | Cyclify</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--blue:#0039a6;--ink:#101828;--muted:#667085;--line:#e4e7ec;--soft:#f7f8fa;--green:#067647}
*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:Arial,sans-serif}
header{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1240px)/2))}
header img{width:135px}header a{color:var(--blue);text-decoration:none;font-weight:700}.shell{max-width:1240px;margin:30px auto;padding:0 20px}
.heading{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:22px}.heading h1{margin:0 0 6px}.heading p{margin:0;color:var(--muted)}
.refresh{border:1px solid var(--line);background:#fff;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px}.stat span{color:var(--muted);font-size:13px}.stat strong{display:block;font-size:25px;margin-top:7px}
.notice{background:#fff;border:1px solid var(--line);border-radius:13px;padding:24px}.error{border-color:#fda29b;color:#b42318}
.order{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:15px;overflow:hidden}.order-head{display:flex;justify-content:space-between;gap:16px;padding:17px 20px;background:#fafafa;border-bottom:1px solid var(--line)}
.order-head strong{font-size:18px}.order-head small{display:block;color:var(--muted);margin-top:5px}.status{color:var(--green);font-weight:800}.order-body{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:20px}
.order h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 10px}.order p{margin:5px 0;line-height:1.45}.items{grid-column:1/-1;border-top:1px solid var(--line);padding-top:16px}
.item{display:flex;justify-content:space-between;gap:15px;margin:8px 0}.total{font-size:18px;font-weight:800}.wa{display:inline-block;margin-top:10px;color:#fff;background:#128c7e;border-radius:8px;padding:10px 13px;text-decoration:none;font-weight:700}
@media(max-width:700px){.stats{grid-template-columns:1fr}.order-body{grid-template-columns:1fr}.items{grid-column:auto}.heading{align-items:start;flex-direction:column}}
</style>
</head>
<body>
<header><a href="index.html"><img src="assets/Logo-original.png" alt="Cyclify"></a><a href="account.html">My account</a></header>
<main class="shell">
<div class="heading"><div><h1>Admin Orders</h1><p>Private overview of customer orders received by Cyclify.</p></div><button class="refresh" id="refreshBtn" type="button">Refresh</button></div>
<section id="loading" class="notice">Checking administrator access…</section>
<section id="content" hidden>
<div class="stats"><div class="stat"><span>Total orders</span><strong id="orderCount">0</strong></div><div class="stat"><span>Items ordered</span><strong id="itemsCount">0</strong></div><div class="stat"><span>Order value</span><strong id="orderValue">₹0</strong></div></div>
<div id="orders"></div>
</section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import{getFirestore,collectionGroup,getDocs,query,orderBy}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCITVZ00CZGBspP0y32AuFJjMvTk0rnr0w",authDomain:"cyclify-b809a.firebaseapp.com",projectId:"cyclify-b809a",storageBucket:"cyclify-b809a.firebasestorage.app",messagingSenderId:"748931097863",appId:"1:748931097863:web:0954f07a8245703f2751a2"});
const auth=getAuth(app),db=getFirestore(app);
let adminUser=null;
const money=value=>`₹${Number(value||0).toLocaleString("en-IN")}`;
const safe=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
function showError(message){loading.className="notice error";loading.textContent=message;loading.hidden=false;content.hidden=true}
async function loadOrders(){
 loading.className="notice";loading.textContent="Loading customer orders…";loading.hidden=false;content.hidden=true;
 try{
  const snapshot=await getDocs(query(collectionGroup(db,"orders"),orderBy("createdAt","desc")));
  const data=snapshot.docs.map(order=>({id:order.id,...order.data()}));
  orderCount.textContent=data.length;
  itemsCount.textContent=data.reduce((sum,order)=>sum+(order.items||[]).reduce((n,item)=>n+(item.quantity||1),0),0);
  orderValue.textContent=money(data.reduce((sum,order)=>sum+Number(order.total||0),0));
  orders.innerHTML=data.length?data.map(order=>{
   const address=order.address||{},date=order.createdAt?.toDate?.();
   const phone=address.phone||"";
   return `<article class="order">
    <div class="order-head"><div><strong>Order #${safe(order.number)}</strong><small>${date?date.toLocaleString("en-IN"):"Date pending"}</small></div><span class="status">${safe(order.status)}</span></div>
    <div class="order-body">
     <div><h3>Customer</h3><p><strong>${safe(`${address.firstName||""} ${address.lastName||""}`.trim()||"Customer")}</strong></p><p>UID: ${safe(order.customerId)}</p>${phone?`<p>${safe(phone)}</p>`:""}</div>
     <div><h3>Delivery address</h3><p>${safe(address.address)}${address.flat?`, ${safe(address.flat)}`:""}<br>${safe(address.city)}, ${safe(address.state)} ${safe(address.pincode)}<br>${safe(address.country)}</p>${order.gstin?`<p>GSTIN: ${safe(order.gstin)}<br>${safe(order.businessName)}</p>`:""}</div>
     <div class="items"><h3>Items</h3>${(order.items||[]).map(item=>`<div class="item"><span>${safe(item.name)} × ${item.quantity||1}${item.size?` (${safe(item.size)})`:""}</span><strong>${money(Number(String(item.price).replace(/[^0-9.]/g,""))*(item.quantity||1))}</strong></div>`).join("")}<div class="item total"><span>Total</span><span>${money(order.total)}</span></div><a class="wa" href="https://wa.me/message/MLT2FFSAEYGIP1?text=${encodeURIComponent(`Regarding Cyclify order #${order.number}`)}">Open WhatsApp support</a></div>
    </div>
   </article>`}).join(""):'<div class="notice">No orders have been received yet.</div>';
  loading.hidden=true;content.hidden=false;
 }catch(error){console.error(error);showError("Orders could not be loaded. Confirm the latest Firestore rules are published and try again.")}
}
refreshBtn.addEventListener("click",loadOrders);
onAuthStateChanged(auth,async user=>{
 if(!user){location.replace(`account.html?return=${encodeURIComponent("admin.html")}`);return}
 if(user.email?.toLowerCase()!=="admin@cyclify.in"||!user.emailVerified){showError("Access denied. Sign in with the verified Cyclify administrator account.");return}
 adminUser=user;loadOrders();
});
</script>
</body>
</html>
